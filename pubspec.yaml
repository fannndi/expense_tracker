name: student_expense_tracker
description: A personal expense tracker for university students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^18.1.1

  # Storage
  path_provider: ^2.1.6
  
  # Charts
  fl_chart: ^1.3.0

  # PDF & Sharing
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1

  # Auto-fill scheduling
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.3

  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
